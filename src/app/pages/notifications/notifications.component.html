<div class="notification-list">
  <button class="panel notification-card clickable" *ngFor="let n of store.notifications" (click)="open(n.link)">
    <div class="notification-large" [ngClass]="n.kind">♧</div>
    <div class="notification-body">
      <div class="notification-meta">{{ labels[n.kind] }} · {{ n.date }}</div>
      <h3>{{ n.title }}</h3>
      <p>{{ n.message }}</p>
    </div>
    <b class="go">›</b>
  </button>

  <div class="panel empty-block" *ngIf="store.notifications.length === 0">
    <strong>You're all caught up.</strong>
    <p>Nothing needs your attention right now. You can change what appears here under My Profile → Preferences.</p>
    <button class="secondary-button" (click)="open('/profile')">Open preferences</button>
  </div>
</div>
<p class="info-note">These reminders are built from the live schedules and concerns you are allowed to see. Tap one to open it.</p>
